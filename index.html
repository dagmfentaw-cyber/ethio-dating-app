<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Match - Ethio Dating App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

  <!-- Registration Modal Overlay -->
  <div id="onboardingModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-5">
      
      <div class="text-center">
        <h2 class="text-2xl font-bold text-rose-600">❤️ Create Your Profile</h2>
        <p class="text-sm text-gray-500 mt-1">Join Habesha Match & start swiping</p>
      </div>

      <!-- On-Screen Debug Error Box -->
      <div id="errorBox" class="hidden p-3 bg-red-100 border border-red-400 text-red-700 text-xs rounded-xl break-words"></div>

      <form id="profileForm" class="space-y-4">
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Full Name</label>
          <input type="text" id="fullName" required placeholder="e.g. Bethlehem Abebe"
                 class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>

        <!-- Profile Photo File Input -->
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Profile Photo</label>
          <input type="file" id="avatarFile" accept="image/*" required
                 class="w-full px-3 py-2 text-sm rounded-xl border border-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-rose-50 file:text-rose-600 hover:file:bg-rose-100">
        </div>

        <!-- Age & City -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Age</label>
            <input type="number" id="age" min="18" max="99" required placeholder="24"
                   class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">City</label>
            <select id="city" required class="w-full px-3 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500 bg-white text-sm">
              <option value="">Select City</option>
              <option value="Addis Ababa">Addis Ababa (አዲስ አበባ)</option>
              <option value="Bahir Dar">Bahir Dar (ባሕር ዳር)</option>
              <option value="Hawassa">Hawassa (ሐዋሳ)</option>
              <option value="Dire Dawa">Dire Dawa (ድሬዳዋ)</option>
              <option value="Gondar">Gondar (ጎንደር)</option>
              <option value="Mekelle">Mekelle (መቀሌ)</option>
              <option value="Adama">Adama (አዳማ)</option>
            </select>
          </div>
        </div>

        <!-- Relationship Goal -->
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Relationship Goal</label>
          <select id="intent" required class="w-full px-3 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-500 bg-white text-sm">
            <option value="">What are you looking for?</option>
            <option value="Serious Relationship">Serious Relationship / Marriage (ፅኑ ግንኙነት)</option>
            <option value="Casual Dating">Casual Dating (የቀረበ ወዳጅነት)</option>
            <option value="Friendship & Networking">New Friends (ጓደኝነት)</option>
          </select>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn"
                class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl shadow-md transition-all duration-200">
          Save & Start Swiping
        </button>
      </form>
    </div>
  </div>

  <!-- Main App Container -->
  <main id="appContainer" class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 hidden">
    <header class="flex justify-between items-center py-2">
      <h1 class="text-xl font-black text-rose-600 tracking-wide">HabeshaMatch</h1>
      <span id="userBadge" class="text-xs bg-rose-100 text-rose-700 font-semibold px-3 py-1 rounded-full"></span>
    </header>

    <div class="my-auto bg-white rounded-3xl shadow-lg border border-gray-100 p-6 text-center space-y-4">
      <img id="userAvatarPreview" class="w-28 h-28 rounded-full object-cover mx-auto shadow-md border-2 border-rose-500" src="" alt="Profile Photo">
      <h2 id="userNameDisplay" class="text-2xl font-bold text-gray-800">You're All Set!</h2>
      <p class="text-gray-500 text-sm">Welcome to Habesha Match. Your profile picture and details have been saved to Supabase.</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://ubvukfxtuxbyajngpmyd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_G6CMV5kJgKgTVIuuP0iM2w_TVQ2IpeC";
    
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const onboardingModal = document.getElementById('onboardingModal');
    const appContainer = document.getElementById('appContainer');
    const profileForm = document.getElementById('profileForm');
    const userBadge = document.getElementById('userBadge');
    const errorBox = document.getElementById('errorBox');
    const userAvatarPreview = document.getElementById('userAvatarPreview');
    const userNameDisplay = document.getElementById('userNameDisplay');

    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }

    // Check local memory
    const savedUser = JSON.parse(localStorage.getItem('habesha_user_profile'));
    if (savedUser) {
      showMainApp(savedUser.full_name, savedUser.avatar_url);
    }

    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Uploading photo & saving...';

      try {
        const avatarFileInput = document.getElementById('avatarFile');
        let avatarUrl = null;

        // 1. Upload file to Supabase Storage if selected
        if (avatarFileInput.files.length > 0) {
          const file = avatarFileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

          const { data: uploadData, error: uploadError } = await supabaseClient.storage
            .from('avatars')
            .upload(fileName, file);

          if (uploadError) {
            throw new Error("Photo upload failed: " + uploadError.message);
          }

          // Get Public URL
          const { data: publicUrlData } = supabaseClient.storage
            .from('avatars')
            .getPublicUrl(fileName);

          avatarUrl = publicUrlData.publicUrl;
        }

        // 2. Insert record into profiles table
        const profileData = {
          full_name: document.getElementById('fullName').value.trim(),
          age: parseInt(document.getElementById('age').value),
          city: document.getElementById('city').value,
          intent: document.getElementById('intent').value,
          avatar_url: avatarUrl
        };

        const { data, error } = await supabaseClient
          .from('profiles')
          .insert([profileData])
          .select();

        if (error) throw new Error("Database insert failed: " + error.message);

        // Save locally
        localStorage.setItem('habesha_user_profile', JSON.stringify(profileData));

        showMainApp(profileData.full_name, profileData.avatar_url);
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Save & Start Swiping';
      }
    });

    function showMainApp(name, avatar) {
      onboardingModal.classList.add('hidden');
      appContainer.classList.remove('hidden');
      userBadge.innerText = `👋 ${name}`;
      userNameDisplay.innerText = `Welcome, ${name}!`;
      if (avatar) {
        userAvatarPreview.src = avatar;
      } else {
        userAvatarPreview.src = 'https://via.placeholder.com/150?text=User';
      }
    }
  </script>
</body>
</html>
